  <style amp-custom>
    :root {
      --maxw: 480px;
      --nav-h: 62px;
      --nav-space: 75px;

      --c-bg: #09040f;
      --c-red: #f7b500;
      --c-dark-red: #6a2bbd;
      --c-white: #fff3cf;
      --c-glass: rgba(18, 6, 29, 0.90);
      --c-border: rgba(247, 181, 0, 0.55);

      --r-card: 16px;
      --r-btn: 10px;

      --shadow-hd:
        0 10px 30px rgba(0, 0, 0, 0.90),
        0 0 20px rgba(247, 181, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::-webkit-scrollbar {
      display: none;
    }

    html {
      max-width: var(--maxw);
      margin: 0 auto;
      background-color: var(--c-bg);
      background-image: url('https://www.roro4dlogin.com/images/transaksi.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
      font-family: 'Rajdhani', sans-serif;
      position: relative;
    }

    html::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(
          circle at 50% 30%,
          rgba(60, 15, 91, 0.78) 0%,
          rgba(7, 2, 13, 0.94) 80%
        );
      z-index: -1;
    }

    body {
      color: var(--c-white);
      overflow-x: hidden;
    }

    main {
      padding-bottom: var(--nav-space);
    }

    .overpower {
      padding: 12px 12px 0;
    }

    .code-block {
      position: relative;
      margin-bottom: 22px;
      border-radius: var(--r-card);
      padding: 2px;

      background:
        linear-gradient(
          135deg,
          var(--c-red),
          var(--c-white),
          var(--c-dark-red),
          var(--c-red)
        );

      background-size: 300% 300%;
      animation: borderMove 4s ease infinite;

      box-shadow:
        0 12px 35px rgba(0,0,0,0.9),
        0 0 25px rgba(247, 181, 0, 0.45);
    }

    @keyframes borderMove {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .combo-inner {
      background: var(--c-glass);
      backdrop-filter: blur(8px);
      border-radius: calc(var(--r-card) - 2px);
      overflow: hidden;
    }

    .combo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;

      background:
        linear-gradient(
          180deg,
          rgba(106, 43, 189, 0.38) 0%,
          rgba(8, 2, 14, 0.90) 100%
        );

      border-bottom: 1px solid var(--c-border);
    }

    .button-container {
      display: flex;
      gap: 8px;
    }

    .btn {
      position: relative;
      display: inline-block;

      background:
        linear-gradient(
          135deg,
          #ffd84d 0%,
          #f7b500 45%,
          #9d5d00 100%
        );

      color: #241028;

      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 8px 16px;
      border-radius: var(--r-btn);

      border: 1px solid rgba(255, 238, 173, 0.80);

      box-shadow:
        0 4px 15px rgba(247, 181, 0, 0.55),
        inset 0 2px 3px rgba(255, 248, 211, 0.75);

      transition: all 0.2s ease;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;

      background:
        linear-gradient(
          45deg,
          transparent,
          rgba(255, 255, 255, 0.75),
          transparent
        );

      transform: rotate(45deg) translateY(-100%);
      animation: shine 3s infinite;
    }

    @keyframes shine {
      0% {
        transform: rotate(45deg) translateY(-100%);
      }

      20%,
      100% {
        transform: rotate(45deg) translateY(100%);
      }
    }

    .btn-white {
      background:
        linear-gradient(
          135deg,
          #8d3bc4 0%,
          #4f1b7a 55%,
          #2b0d45 100%
        );

      color: #ffd86a;

      box-shadow:
        0 4px 15px rgba(132, 47, 190, 0.50),
        inset 0 2px 3px rgba(216, 164, 255, 0.40);

      border: 1px solid #dcae43;
    }

    .code-hero {
      position: relative;
      width: 100%;
      display: block;
      background: #050208;
      overflow: hidden;
    }

    .code-hero amp-carousel {
      width: 100%;
    }

    .code-hero amp-img img {
      object-fit: cover;
      object-position: center;
    }

    .abonus {
      display: grid;
      gap: 12px;
    }

    .block {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px 20px;
      border-radius: var(--r-card);
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 1.5px;
      color: var(--c-white);

      background:
        linear-gradient(
          135deg,
          rgba(67, 18, 99, 0.94) 0%,
          rgba(13, 4, 22, 0.97) 100%
        );

      border: 1px solid var(--c-border);

      box-shadow: var(--shadow-hd);

      text-shadow:
        0 2px 4px rgba(0,0,0,0.90),
        0 0 10px rgba(247, 181, 0, 0.75);

      transition:
        all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);

      overflow: hidden;
    }

    .block::before {
      content: '';
      position: absolute;
      inset: -2px;

      background:
        linear-gradient(
          90deg,
          var(--c-red),
          var(--c-white),
          var(--c-dark-red),
          var(--c-red)
        );

      background-size: 300%;
      z-index: -1;

      border-radius:
        calc(var(--r-card) + 2px);

      opacity: 0.45;
      animation: steam 5s linear infinite;
    }

    .block::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 220, 113, 0.35),
          transparent
        );

      transform: skewX(-25deg);
      animation: lightSweep 4s ease-in-out infinite;
    }

    @keyframes lightSweep {
      0%,
      50% {
        left: -100%;
      }

      70%,
      100% {
        left: 200%;
      }
    }

    .block:hover,
    .block:active {
      transform: translateY(-3px) scale(1.02);
      border-color: var(--c-white);

      background:
        linear-gradient(
          135deg,
          rgba(121, 42, 174, 0.97) 0%,
          rgba(38, 9, 58, 0.97) 100%
        );

      box-shadow:
        0 15px 30px rgba(0,0,0,1),
        0 0 25px rgba(247, 181, 0, 0.80);
    }

    .footer {
      text-align: center;
      margin: 25px 0 15px;
      color: rgba(255, 241, 201, 0.85);
      font-size: 11px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 1px 2px #050208;
    }
	.footer a {
      color: #f7b500;
      text-decoration: none;
      text-shadow: 0 0 8px rgba(247, 181, 0, 0.55);
    }

    #bottom-navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: var(--maxw);
      margin: 0 auto;
      z-index: 999;

      background: rgba(18, 5, 29, 0.96);

      backdrop-filter: blur(15px);

      border-top:
        1px solid var(--c-border);

      box-shadow:
        0 -10px 25px rgba(0,0,0,0.9),
        0 -2px 10px rgba(247, 181, 0, 0.35);
    }

    #bottom-navbar ul {
      display: flex;
      list-style: none;
    }

    #bottom-navbar ul li {
      width: 33.3333%;
    }

    #bottom-navbar ul li a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: var(--nav-h);
      text-decoration: none;
      color: var(--c-white);
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    #bottom-navbar ul li+li a {
      border-left:
        1px solid rgba(247, 181, 0, 0.18);
    }

    #bottom-navbar span.material-icons {
      font-size: 22px;
      color: var(--c-red);

      filter:
        drop-shadow(
          0 0 6px rgba(247, 181, 0, 0.90)
        );

      transition:
        transform 0.2s ease;
    }

    #bottom-navbar ul li a:hover span.material-icons {
      transform:
        translateY(-3px) scale(1.2);

      color: var(--c-white);

      filter:
        drop-shadow(
          0 0 8px #ffd86a

    }

    #bottom-navbar ul li a:hover {
      background:
        linear-gradient(
          180deg,
          rgba(106, 43, 189, 0.38) 0%,
          transparent 100%
        );

      color: var(--c-white);
    }

    @keyframes steam {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }
  </style>
</head>
